name: Package VSIX

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package
        required: true
      ref:
        description: Ref to build from (defaults to the tag)
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: package-vsix-${{ github.event.workflow_run.head_branch || github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: Package VSIX
    runs-on: macos-15
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            tag="${{ github.event.workflow_run.head_branch }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$tag" ]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the packaging ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || steps.tag.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Check versions
        run: node scripts/check-versions.mjs "${{ steps.tag.outputs.tag }}"

      - name: Download release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          mkdir -p dist
          expected=(
            solrepr-x86_64-unknown-linux-gnu.tar.xz
            solrepr-aarch64-apple-darwin.tar.xz
            solrepr-x86_64-pc-windows-msvc.zip
          )
          for attempt in $(seq 1 30); do
            gh release download "$tag" --dir dist --clobber || true
            missing=0
            for file in "${expected[@]}"; do
              [ -f "dist/$file" ] || missing=1
            done
            [ "$missing" -eq 0 ] && break
            sleep 10
          done
          for file in "${expected[@]}"; do
            [ -f "dist/$file" ] || { echo "missing release asset: $file"; exit 1; }
          done

      - name: Ad-hoc sign macOS binary
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/solrepr-aarch64-apple-darwin.tar.xz"
          work="$(mktemp -d)"
          tar -xJf "$archive" -C "$work"
          binary="$(find "$work" -type f -name solrepr | head -n 1)"
          codesign --force --sign - "$binary"
          top="$(basename "$(dirname "$binary")")"
          tar -cJf "$archive" -C "$work" "$top"
          rm -rf "$work"

      - name: Upload signed macOS archives
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            dist/solrepr-aarch64-apple-darwin.tar.xz \
            --clobber

      - name: Build extension
        working-directory: extensions/vscode
        run: |
          npm ci
          npm run typecheck
          npm run compile

      - name: Package platform VSIX files
        working-directory: extensions/vscode
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          out="$GITHUB_WORKSPACE/vsix"
          mkdir -p "$out"

          # Only a version with a prerelease suffix is packaged as a preview.
          # A scalar, not an array: macOS runners still ship bash 3.2, where
          # `"${pre[@]}"` on an empty array is an unbound variable under `set -u`.
          pre=""
          if [[ "$version" == *-* ]]; then pre="--pre-release"; fi

          while IFS='|' read -r target triple binary_name; do
            archive="$GITHUB_WORKSPACE/dist/solrepr-${triple}.tar.xz"
            [ -f "$archive" ] || archive="$GITHUB_WORKSPACE/dist/solrepr-${triple}.zip"

            work="$(mktemp -d)"
            case "$archive" in
              *.zip) unzip -q "$archive" -d "$work" ;;
              *) tar -xJf "$archive" -C "$work" ;;
            esac
            binary="$(find "$work" -type f -name "$binary_name" | head -n 1)"

            stage="$(mktemp -d)/extension"
            mkdir -p "$stage/bin/$target"
            cp package.json .vscodeignore LICENSE README.md icon.png "$stage/"
            cp -R out "$stage/out"
            cp "$binary" "$stage/bin/$target/$binary_name"

            (cd "$stage" && "$GITHUB_WORKSPACE/extensions/vscode/node_modules/.bin/vsce" package --target "$target" ${pre:+"$pre"} --no-dependencies --out "$out/solrepr-${version}-${target}.vsix")
            rm -rf "$work" "$(dirname "$stage")"
          done <<'TARGETS'
          linux-x64|x86_64-unknown-linux-gnu|solrepr
          darwin-arm64|aarch64-apple-darwin|solrepr
          win32-x64|x86_64-pc-windows-msvc|solrepr.exe
          TARGETS

      - name: Package universal VSIX
        working-directory: extensions/vscode
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          out="$GITHUB_WORKSPACE/vsix"
          pre=""
          if [[ "$version" == *-* ]]; then pre="--pre-release"; fi
          stage="$(mktemp -d)/extension"
          mkdir -p "$stage"
          cp package.json .vscodeignore LICENSE README.md icon.png "$stage/"
          cp -R out "$stage/out"
          (cd "$stage" && "$GITHUB_WORKSPACE/extensions/vscode/node_modules/.bin/vsce" package ${pre:+"$pre"} --no-dependencies --out "$out/solrepr-${version}-universal.vsix")
          rm -rf "$(dirname "$stage")"

      - name: Upload VSIX files to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" vsix/*.vsix --clobber

      - name: Set release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          version="$(node -p "require('./extensions/vscode/package.json').version")"
          work="$(mktemp -d)"
          # dist's own body is the canonical server section; rebuilding from the manifest keeps
          # this step idempotent instead of appending a second copy on a re-run. A release that
          # was not produced by the Release workflow has no manifest asset, so leave its body be.
          if gh release download "$tag" --pattern dist-manifest.json --dir "$work" --clobber; then
            if [ ! -f scripts/release-notes.mjs ]; then
              echo "no scripts/release-notes.mjs in this checkout; leaving the release body unchanged"
              exit 0
            fi
            node scripts/release-notes.mjs "$version" "$tag" "$work/dist-manifest.json" > "$work/notes.md"
            gh release edit "$tag" --notes-file "$work/notes.md"
          else
            echo "no dist-manifest.json asset on $tag; leaving the release body unchanged"
          fi

      - name: Publish VSIX files to the VS Code Marketplace
        working-directory: extensions/vscode
        shell: bash
        run: |
          set -euo pipefail
          for vsix in "$GITHUB_WORKSPACE"/vsix/*.vsix; do
            ./node_modules/.bin/vsce publish --oidc --packagePath "$vsix" --skip-duplicate
          done
