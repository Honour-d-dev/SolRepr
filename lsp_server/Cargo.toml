[package]
name = "lsp_server"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
camino = "1.2.2"
crossbeam-channel = "0.5.15"
ignore = "0.4"
lsp-server = "0.7"
lsp-types = "0.94"
ropey = "1.6.1"
rustc-hash = "2.1.2"
slotmap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26.6"
tree-sitter-solidity = { git = "https://github.com/Honour-d-dev/tree-sitter-solidity.git", rev = "3ba3dd3" }
salsa = "0.26.2"
toml = "1.1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smol_str = "0.3.6"
la-arena = "0.3.1"
parking_lot = "0.12.5"
triomphe = "0.1.15"
smallvec = "1.15.2"
num-bigint = "0.4.6"
dashmap = "6.2.1"
glob = "0.3.4"
